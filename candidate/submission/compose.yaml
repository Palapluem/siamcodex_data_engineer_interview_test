# Meridian operational view - candidate submission.
#
# Run:  python submission/setup_env.py          (once, generates .env)
#       docker compose -f submission/compose.yaml up -d --build
#
# Resource allocations are justified in docs/RESOURCE_REPORT.md. Only the result
# API is published, on loopback. The database has no published port and is
# reachable only on the private app network.
name: de-interview-submission

services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: meridian-pipeline:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pipeline:${PIPELINE_DB_PASSWORD:?run python submission/setup_env.py first}@postgres:5432/meridian
      LAB_CA_PATH: /run/secrets/lab_ca.crt
      SOURCE_CREDENTIALS_PATH: /run/secrets/source_credentials.json
      IDENTITY_SERVICE_KEY_PATH: /run/secrets/identity_service.key
      IDENTITY_URL: https://identity:8443/introspect
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Bangkok}
      CLEARANCE_FILTERS_AGGREGATES: ${CLEARANCE_FILTERS_AGGREGATES:-true}
      PAGE_LIMIT: ${PAGE_LIMIT:-200}
      POLL_IDLE_SECONDS: ${POLL_IDLE_SECONDS:-3}
      INTROSPECT_CACHE_SECONDS: ${INTROSPECT_CACHE_SECONDS:-5}
      ROLE: ${ROLE:-all}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8088:8080"
    networks: [transit, app]
    volumes:
      # Individual read-only client credentials only. test_tokens.json belongs to
      # API callers and is deliberately absent; .runtime/server is never mounted.
      - ../.runtime/client/ca.crt:/run/secrets/lab_ca.crt:ro
      - ../.runtime/client/source_credentials.json:/run/secrets/source_credentials.json:ro
      - ../.runtime/client/identity_service.key:/run/secrets/identity_service.key:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: ${PIPELINE_DB_PASSWORD:?run python submission/setup_env.py first}
      POSTGRES_DB: meridian
      # The volume is ours alone, so initdb does not need to re-derive these.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    # No ports: the database is private to the app network by construction.
    networks: [app]
    volumes:
      - pipeline_pgdata:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=30
      - -c
      - log_min_duration_statement=500
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U pipeline -d meridian"]
      interval: 5s
      timeout: 5s
      retries: 12
    # read_only is not applied: initdb and the WAL need a writable data directory.
    # The volume is the only writable surface; see docs/TRUST_BOUNDARIES.md.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.75
    restart: unless-stopped

networks:
  transit:
    external: true
    name: de-interview-transit
  app: {}

volumes:
  pipeline_pgdata: {}
